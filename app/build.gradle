plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.codeassist.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.codeassist.ai"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "2.2"

        // LiteRT-LM + llama.cpp runtimes ship native libs; keep the current device ABIs.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'com.google.code.gson:gson:2.14.0'
    // Gemma 4 E4B IT .litertlm runtime
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.17.1'
    // GGUF Coder Helper runtime (llama.cpp, arm64-v8a)
    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    testImplementation 'junit:junit:4.13.2'
}
