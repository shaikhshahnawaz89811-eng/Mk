name: Android CI — Build, test and lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify:
    name: Verify Android source
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # setup-android performs license acceptance non-interactively.
          # Do not run the manual interactive sdkmanager license command ourselves: that command can
          # open the interactive license prompt seen in the failed CI run.
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: 15859902

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          java -version
          "$SDKMANAGER" --version
          adb version
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Show Gradle version
        run: ./gradlew --no-daemon --version

      - name: Offline structural pipeline verification
        run: python3 tools/verify_pipeline.py

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Run lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build Release APK (unsigned)
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeAssistAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeAssistAI-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
